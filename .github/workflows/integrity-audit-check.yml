name: Integrity audit check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr", "here", "readr", "stringr", "tibble", "rlang"), repos="https://cloud.r-project.org")'

      - name: Run integrity audit script
        run: |
          Rscript R/integrity/run_pfc_audit.R

      - name: Validate audit outputs exist
        run: |
          test -f output/tables/audit_falsification.csv
          test -f output/tables/audit_subsample_robustness.csv
          test -f output/tables/audit_outlier_sensitivity.csv
          test -f output/tables/audit_summary.md
